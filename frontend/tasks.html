<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Manager - SuuSri</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <nav class="navbar">
    <h2 class="navbar-brand">SuuSri<span>AI</span></h2>
    <div class="navbar-right">
      <span class="user-name">Task Manager</span>
    </div>
  </nav>

  <div class="task-page">
    <h1>My Tasks</h1>
    <p class="page-subtitle">Add, view, and manage your daily tasks.</p>

    <form id="taskForm" class="task-form">
      <input type="text" id="taskInput" placeholder="Enter a new task..." required>
      <button type="submit" class="btn-primary">Add Task</button>
    </form>

    <ul id="taskList" class="task-list">
      <!-- Tasks will appear here -->
    </ul>
  </div>

  <script src="tasks.js"></script>
</body>
</html>
